<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027 수능 영어 킬러 문항과 온디바이스 에듀테크 실전 연수</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #FFFFFF;
      --primary: #0064E0;
      --primary-light: #EBF3FF;
      --text: #1C2B33;
      --subtext: #596E79;
      --border: #E1E8ED;
      --card-bg: #F8FAFC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', sans-serif;
      background: #0B141A;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #deck-container {
      width: 960px;
      height: 540px;
      background: var(--bg);
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .slide {
      flex: 1;
      padding: 48px 56px;
      display: none;
      flex-direction: column;
      animation: fadeIn 0.25s ease-in-out;
    }
    .slide.active { display: flex; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .chapter {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .slide-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .slide-subtitle {
      font-size: 15px;
      color: var(--subtext);
      margin-bottom: 28px;
    }
    .content-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    /* 타입별 스타일 */
    .cover-box {
      text-align: left;
      margin-top: 40px;
    }
    .cover-title {
      font-size: 36px;
      font-weight: 900;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 16px;
    }
    .cover-sub {
      font-size: 18px;
      color: var(--subtext);
      max-width: 800px;
      line-height: 1.5;
    }
    
    .bullets-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .bullet-item {
      background: var(--card-bg);
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
    }
    
    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      height: 100%;
    }
    .compare-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .compare-card.right {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--primary);
    }
    
    .process-steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .step-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 12px;
      text-align: center;
    }
    .step-num {
      display: inline-block;
      width: 28px;
      height: 28px;
      line-height: 28px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      border-radius: 50%;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .step-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .step-desc { font-size: 12px; color: var(--subtext); line-height: 1.4; }
    
    .table-custom {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    .table-custom th, .table-custom td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .table-custom th {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
    }
    
    .quote-box {
      background: var(--primary-light);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
    }
    .quote-text {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.4;
      margin-bottom: 16px;
    }
    .quote-attr { font-size: 14px; color: var(--subtext); }
    
    .bottom-bar {
      height: 48px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 13px;
      color: var(--subtext);
    }
    .nav-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text);
    }
    .nav-btn:hover { background: var(--primary); color: #fff; }
  </style>
</head>
<body>
  <div style="position: absolute; top: 16px; left: 24px; z-index: 100;">
    <a href="index.html" style="color: #FFFFFF; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.25); padding: 7px 14px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; backdrop-filter: blur(4px);">
      ← 허브 대시보드
    </a>
  </div>

  <div id="deck-container">
    <div id="slide-wrapper"></div>
    <div class="bottom-bar">
      <span id="subject-label">교원 직무연수 · 고등학교 교과 평가 혁신</span>
      <div style="display:flex; gap:10px; align-items:center;">
        <button class="nav-btn" onclick="prevSlide()">◀ 이전</button>
        <span id="counter" style="font-weight:700; min-width:60px; text-align:center;"></span>
        <button class="nav-btn" onclick="nextSlide()">다음 ▶</button>
      </div>
    </div>
  </div>

  <script>
    const slidesData = [{"type": "cover", "eyebrow": "2026-2027 고등학교 교원 전문성 향상 직무연수", "title": "2027 수능 영어 킬러 문항과 온디바이스 에듀테크", "subtitle": "평가원 출제 원리부터 학생 데이터 보안 로컬 RAG까지, 교사를 위한 실전 워크플로우", "image": null, "showImageSlot": true, "imageLabel": "온디바이스 에듀테크 대표 비주얼"}, {"type": "bullets", "chapter": "01. 연수 목표 (SMART Goal)", "title": "오늘 함께 달성할 세 가지 실무 역량", "subtitle": "구체적이고 측정 가능한 현장 중심 목표를 공유합니다", "bullets": ["평가원 빈칸추론 문항의 오답 매력도 4대 함정 설계 원리를 이해하고 분석할 수 있다", "EmbeddingGemma 2(740M)를 활용해 외부 유출 없는 온디바이스 교과 RAG를 구축한다", "Gemini와 Claude 2-Agent 교차 감사 하네스로 세특 기재금지어를 100% 사전 차단한다"], "showImageSlot": true, "imageLabel": "실전 수업 및 평가 현장"}, {"type": "compare", "chapter": "02. 환경 비교", "title": "상용 클라우드 AI vs 온디바이스 SLM", "subtitle": "학교 현장의 데이터 보안과 독립적 운영 관점에서의 비교", "leftTitle": "상용 클라우드 AI (API 의존)", "leftItems": ["학생 개인정보 및 미공개 문항 외부 유출 위험", "토큰당 과금 및 유료 구독료 지속 발생", "학교 인터넷망 차단 시 수업 및 업무 중단"], "rightTitle": "온디바이스 SLM (EmbeddingGemma 2)", "rightItems": ["100% 로컬 오프라인 구동으로 개인정보 원천 보호", "추가 API 비용 0원의 영구 독립형 시스템", "인터넷 연결 없는 고사장 및 교실에서도 즉각 작동"]}, {"type": "process", "chapter": "03. 출제 절차", "title": "수능 킬러 문항 제작의 4단계 파이프라인", "subtitle": "논리적 인과 분석부터 매력적 오답 설계까지", "steps": [{"title": "학술 지문 선정", "desc": "인공지능 윤리 등 수능 빈출 학술 텍스트 추출 (140~180단어)"}, {"title": "논리 구조 분석", "desc": "전제-반박-결론의 담화 표제어 및 인과관계 매핑"}, {"title": "핵심 빈칸 설정", "desc": "필자의 궁극적 결론 부위에 빈칸 및 패러프레이징 정답 배치"}, {"title": "오답 매력도 설계", "desc": "반대 논리 왜곡과 과잉 일반화 등 4대 함정 선지 구성"}]}, {"type": "table", "chapter": "04. 오답 매력도", "title": "평가원 4대 오답 매력도 설계 매트릭스", "subtitle": "수험생이 가장 많이 빠지는 오답 유형과 소거 논리", "headers": ["함정 유형", "설계 메커니즘", "매력도 지수", "소거 지도법"], "rows": [["CONTRADICTION", "지문 소재를 담고 있으나 인과 방향이 정반대", "4 ~ 5점", "However 이후 결론과의 일치 여부 대조"], ["OVERGENERALIZATION", "상식적으로 그럴듯한 통념을 긍정적으로 포장", "3 ~ 4점", "지문 논거의 범위를 벗어난 비약 검출"], ["IRRELEVANT_DETAIL", "지문에 언급된 단어이지만 중심 주제와 무관", "2 ~ 3점", "문맥적 상위 개념과 지엽적 사실 분리"], ["OUT_OF_SCOPE", "지문 핵심 쟁점과 무관한 엉뚱한 소재 연결", "1 ~ 2점", "핵심 키워드 결여를 통한 1차 빠른 소거"]]}, {"type": "image", "chapter": "05. 시스템 구조", "title": "온디바이스 로컬 RAG 아키텍처", "subtitle": "Matryoshka 256차원 압축을 통한 교사용 PC 최적화", "image": null, "imageLabel": "SQLite-VSS 기반 온디바이스 에듀테크 RAG 파이프라인 다이어그램", "caption": "자체 개발 ondevice_edu_rag.py 엔진 구조도"}, {"type": "quote", "chapter": "06. 교육적 통찰", "quote": "기술은 도구에 불과하며, 본질적인 질문과 최종 검수는 교사의 고유한 전문성이다.", "attribution": "2027 수능 교과 평가 혁신 연수 발문"}, {"type": "closing", "chapter": "07. 정리 및 실습", "title": "오늘 배운 내용을 우리 학교 수업에 적용해봅시다", "message": "수능 문항 분석 파이프라인과 로컬 RAG는 교사의 수업 준비 시간을 획기적으로 줄여줍니다.\n다음 시간에는 각 교과별 실제 활동지를 바탕으로 1:1 실습을 진행합니다.", "question": "Q. 우리 학교 담당 교과에서 가장 먼저 적용해보고 싶은 온디바이스 도구는 무엇인가요?"}];
    let currentIdx = 0;
    const wrapper = document.getElementById('slide-wrapper');
    const counter = document.getElementById('counter');

    function renderSlide(idx) {
      const s = slidesData[idx];
      let inner = '';

      if (s.type === 'cover') {
        inner = `
          <div class="chapter">${s.eyebrow || ''}</div>
          <div class="cover-box">
            <h1 class="cover-title">${s.title}</h1>
            <p class="cover-sub">${s.subtitle}</p>
          </div>
        `;
      } else if (s.type === 'bullets') {
        const bItems = s.bullets.map(b => `<div class="bullet-item">${b}</div>`).join('');
        inner = `
          <div class="chapter">${s.chapter || ''}</div>
          <h2 class="slide-title">${s.title}</h2>
          <div class="slide-subtitle">${s.subtitle || ''}</div>
          <div class="content-box"><div class="bullets-list">${bItems}</div></div>
        `;
      } else if (s.type === 'compare') {
        const lefts = s.leftItems.map(i => `<li style="margin-bottom:8px;">${i}</li>`).join('');
        const rights = s.rightItems.map(i => `<li style="margin-bottom:8px;">${i}</li>`).join('');
        inner = `
          <div class="chapter">${s.chapter || ''}</div>
          <h2 class="slide-title">${s.title}</h2>
          <div class="slide-subtitle">${s.subtitle || ''}</div>
          <div class="content-box">
            <div class="compare-grid">
              <div class="compare-card">
                <div class="card-title">${s.leftTitle}</div>
                <ul style="padding-left:18px; font-size:14px; line-height:1.5;">${lefts}</ul>
              </div>
              <div class="compare-card right">
                <div class="card-title">${s.rightTitle}</div>
                <ul style="padding-left:18px; font-size:14px; line-height:1.5;">${rights}</ul>
              </div>
            </div>
          </div>
        `;
      } else if (s.type === 'process') {
        const st = s.steps.map((st, i) => `
          <div class="step-box">
            <div class="step-num">${i+1}</div>
            <div class="step-title">${st.title}</div>
            <div class="step-desc">${st.desc}</div>
          </div>
        `).join('');
        inner = `
          <div class="chapter">${s.chapter || ''}</div>
          <h2 class="slide-title">${s.title}</h2>
          <div class="slide-subtitle">${s.subtitle || ''}</div>
          <div class="content-box"><div class="process-steps">${st}</div></div>
        `;
      } else if (s.type === 'table') {
        const ths = s.headers.map(h => `<th>${h}</th>`).join('');
        const trs = s.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
        inner = `
          <div class="chapter">${s.chapter || ''}</div>
          <h2 class="slide-title">${s.title}</h2>
          <div class="slide-subtitle">${s.subtitle || ''}</div>
          <div class="content-box">
            <table class="table-custom">
              <thead><tr>${ths}</tr></thead>
              <tbody>${trs}</tbody>
            </table>
          </div>
        `;
      } else if (s.type === 'quote') {
        inner = `
          <div class="chapter">${s.chapter || ''}</div>
          <div class="content-box">
            <div class="quote-box">
              <div class="quote-text">“${s.quote}”</div>
              <div class="quote-attr">— ${s.attribution}</div>
            </div>
          </div>
        `;
      } else if (s.type === 'image') {
        inner = `
          <div class="chapter">${s.chapter || ''}</div>
          <h2 class="slide-title">${s.title}</h2>
          <div class="slide-subtitle">${s.subtitle || ''}</div>
          <div class="content-box" style="align-items:center; text-align:center;">
            <div style="width:100%; height:200px; background:var(--card-bg); border:2px dashed var(--primary); border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--primary); font-weight:700;">
              ${s.imageLabel || '이미지 슬롯'}
            </div>
            <div style="font-size:12px; color:var(--subtext); margin-top:8px;">${s.caption || ''}</div>
          </div>
        `;
      } else if (s.type === 'closing') {
        inner = `
          <div class="chapter">${s.chapter || ''}</div>
          <h2 class="slide-title">${s.title}</h2>
          <div class="content-box">
            <p style="font-size:16px; line-height:1.6; margin-bottom:24px;">${s.message.replace(/\n/g, '<br>')}</p>
            <div style="background:var(--primary-light); padding:16px; border-radius:8px; font-weight:700; color:var(--primary); font-size:15px;">
              ${s.question}
            </div>
          </div>
        `;
      }

      wrapper.innerHTML = `<div class="slide active">${inner}</div>`;
      counter.innerText = `${idx + 1} / ${slidesData.length}`;
    }

    function prevSlide() {
      if (currentIdx > 0) { currentIdx--; renderSlide(currentIdx); }
    }
    function nextSlide() {
      if (currentIdx < slidesData.length - 1) { currentIdx++; renderSlide(currentIdx); }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      else if (e.key === 'ArrowLeft') prevSlide();
    });

    renderSlide(currentIdx);
  </script>
</body>
</html>
